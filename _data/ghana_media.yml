# Photos and videos shown on the Work in Ghana page (/ghana/).
#
# Photos: convert the original with
#   just optimise-photo ~/Downloads/IMG_1234.jpg assets/images/ghana/clinic-visit
# which writes clinic-visit.webp (full size, shown when the photo is tapped)
# and clinic-visit-800.webp (thumbnail), and prints their sizes. Then add an
# entry below pointing at the full-size .webp. Width and height are the
# full-size file's pixel dimensions (they stop the page jumping while images
# load).
#
#   - src: /assets/images/ghana/clinic-visit.webp
#     alt: Describe what the photo shows, for screen reader users
#     caption: Optional caption shown under the photo
#     width: 1600
#     height: 1067
#
# Videos: either a YouTube/Vimeo embed URL (shown in a list below the
# photos), or a self-hosted .mp4 file in assets/videos/ghana/. The section
# heading switches between "Photos", "Videos" and "Photos and videos"
# depending on what's listed here.
#
#   - title: Short title (required - used as the iframe's accessible name)
#     embed: https://www.youtube-nocookie.com/embed/VIDEO_ID
#     caption: Optional caption
#
#   - title: Short title
#     src: /assets/videos/ghana/training-day.mp4
#     poster: /assets/images/ghana/training-day-poster.webp
#     thumb: /assets/images/ghana/training-day-thumb.webp
#     duration: "1:30"
#     caption: Optional caption
#     width: 720
#     height: 1280
#
# Self-hosted videos appear as tiles in the photo grid (with a play button)
# and play in the same full-screen viewer as the photos. The poster is a
# full frame shown before the video plays; thumb is an 800x600 (4:3) crop
# for the tile, so it matches the photos - pick a part of a frame without
# faces or on-screen text in the middle, where the play button sits.
# Without a thumb, the tile crops the poster. Duration (optional, quoted)
# is shown on the tile's "Video" label. Width and height are the
# video's pixel dimensions (they size the viewer before the video loads).
#
# Keep self-hosted videos small: re-encode phone footage to 720p H.264, e.g.
#   ffmpeg -i ~/Downloads/IMG_1234.MOV -vf scale=-2:720 -c:v libx264 -crf 30 \
#     -preset slow -c:a aac -b:a 96k -map_metadata -1 -movflags +faststart \
#     assets/videos/ghana/training-day.mp4
# (use scale=720:-2 for portrait video). iPhone HDR footage needs converting
# to SDR too, or it looks washed out in browsers.

photos:
  - src: /assets/images/ghana/school-assembly.webp
    alt: >-
      Rows of secondary school pupils in blue uniforms seated under a large
      canopy, listening to a talk
    caption: Pupils at Zion College High School (ZICO), Anloga, Volta Region
    width: 1600
    height: 900
  - src: /assets/images/ghana/school-library.webp
    alt: >-
      A school library corner with pink and lilac shelves full of children's
      books
    caption: The library at Optimum Prime School Complex, Kasoa
    width: 1600
    height: 1200
  - src: /assets/images/ghana/mount-sinai-talk.webp
    alt: >-
      A speaker in a white shirt addresses hundreds of pupils in white
      uniforms seated in an open-sided hall with a corrugated roof
    caption: A talk at Mount Sinai Senior High School, Akropong
    width: 1600
    height: 1200
  - src: /assets/images/ghana/mount-sinai-assembly.webp
    alt: >-
      A speaker seen from behind facing a packed hall of pupils in white
      uniforms, many listening closely
    caption: Pupils at Mount Sinai Senior High School, Akropong
    width: 1600
    height: 1200

videos:
  - title: A visit to Optimum Prime School Complex, Kasoa
    src: /assets/videos/ghana/optimum-prime-school.mp4
    poster: /assets/images/ghana/optimum-prime-school-poster.webp
    thumb: /assets/images/ghana/optimum-prime-school-thumb.webp
    duration: "1:30"
    width: 720
    height: 1280
