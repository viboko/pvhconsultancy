<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} | {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines }}">

  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_html | strip_newlines }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ page.image | default: '/assets/images/peter-hasler.jpeg' | absolute_url }}">
  <meta name="twitter:card" content="summary">

  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="32x32">
  <link rel="icon" href="{{ '/assets/icons/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
  <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
  <meta name="theme-color" content="#1f5c5a">

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  <script data-goatcounter="https://pvhconsultancy.goatcounter.com/count"
          async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__brand" href="{{ site.navigation.first.url | relative_url }}">
        <span class="site-header__name">{{ site.title }}</span>
        <span class="site-header__tagline">{{ site.tagline }}</span>
      </a>
      <nav class="site-nav" aria-label="Main">
        <ul class="site-nav__list">
          {%- for item in site.navigation %}
          <li>
            <a class="site-nav__link" href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
          </li>
          {%- endfor %}
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <p>&copy; {{ site.time | date: "%Y" }} PVH Consultancy Limited. Registered company {{ site.company_number }}.</p>
      <p><a href="{{ '/contact/' | relative_url }}">Get in touch</a></p>
    </div>
  </footer>
</body>
</html>
