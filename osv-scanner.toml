# The vulnerabilities below are in transitive, dev-only tooling dependencies
# (linters and Lighthouse CI), never shipped in the built site. Each either
# has no fixed release yet or is only fixed in a version outside the range its
# parent package accepts - revisit before the dates below.

[[IgnoredVulns]]
id = "GHSA-c475-qrg2-pj4r" # basic-ftp, via @lhci/cli -> proxy-agent -> get-uri
ignoreUntil = 2027-01-05
reason = "Dev-only transitive dependency of @lhci/cli; fix is in basic-ftp 6, outside get-uri's ^5 range"

[[IgnoredVulns]]
id = "GHSA-238p-pmpm-9mq7" # katex, via markdownlint-cli -> markdownlint -> micromark-extension-math
ignoreUntil = 2027-01-05
reason = "Dev-only transitive dependency of markdownlint-cli (math syntax only, KaTeX never renders); fix is in katex 0.18, outside micromark-extension-math's ^0.16 range"

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249" # minimatch, via eslint, markdownlint-cli and pa11y-ci -> globby -> glob
ignoreUntil = 2027-01-05
reason = "Dev-only transitive dependency of the linters and pa11y-ci, matching only this repo's own globs; fix is in minimatch 11, outside their ^3 and ^10 ranges"
