title: PVH Consultancy
tagline: Experts in Mental Health
description: >-
  PVH Consultancy is led by Peter Hasler RN (Mental Health) MBA, a former NHS
  Director of Nursing with over 40 years' experience in mental health
  leadership, executive coaching, service reviews and international mental
  health development.
url: "https://pvhconsultancy.com"
company_number: "6758325"

# Formspree form ID for the contact page (the part after /f/ in the form's
# endpoint URL, e.g. "xyzabcde"). Leave empty until the form is set up -
# the contact page shows a notice instead of a working form while it is.
formspree_id: xgakaqbv

# Main navigation, in display order.
navigation:
  - title: About Peter
    url: /
  - title: Work in Ghana
    url: /ghana/
  - title: Contact
    url: /contact/

# The site was previewed under /preview/ before launch. The pages in preview/
# now just redirect those old links to the live pages, and stay out of the
# sitemap.
defaults:
  - scope:
      path: preview
    values:
      layout: redirect
      sitemap: false

plugins:
  - jekyll-sitemap

markdown: kramdown

# Silences Sass deprecation warnings from third-party @use/@import chains.
sass:
  quiet_deps: true

# Repo tooling that shouldn't be published as part of the site.
exclude:
  - README.md
  - justfile
  - package.json
  - package-lock.json
  - eslint.config.js
  - osv-scanner.toml
